<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER_AI_V1.0 // ALL-IN-ONE PLATFORM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="chat-wrapper">
    <header class="chat-header">
      <div style="display: flex; justify-content: space-between; align-items: center; width: 100%; margin-bottom: 10px;">
        <div class="status-indicator">
          <span class="dot"></span>
          <span id="status">SYSTEM ONLINE</span>
        </div>
        <h2>GROQ AI</h2>
      </div>

      <!-- شريط التنقل بين الأقسام -->
      <div class="nav-tabs">
        <button class="tab-btn active" id="btn-chat" onclick="switchTab('chat')">⚡ الشات السريع</button>
        <button class="tab-btn" id="btn-mail" onclick="switchTab('mail')">📧 خدمة البريد (AliMail)</button>
      </div>
    </header>

    <!-- قسم الشات -->
    <div id="chat-tab" class="tab-content active-content">
      <div id="chat-box" class="chat-box">
        <div class="msg system-msg">
          <div class="msg-author">SYSTEM</div>
          <div class="msg-content">مرحباً بك في النظام. اكتب استفسارك للبدء...</div>
        </div>
      </div>

      <div class="chat-input-container">
        <button id="sendBtn" type="button">إرسال ➔</button>
        <input type="text" id="userInput" placeholder="اكتب أمرك أو سؤالك هنا..." />
      </div>
    </div>

    <!-- قسم البريد الإلكتروني -->
    <div id="mail-tab" class="tab-content" style="display: none;">
      <iframe src="https://alimail.onrender.com/" class="app-iframe" title="AliMail Service"></iframe>
    </div>
  </div>

  <script src="js/chat.js"></script>
  <script>
    function switchTab(tab) {
      const chatTab = document.getElementById('chat-tab');
      const mailTab = document.getElementById('mail-tab');
      const btnChat = document.getElementById('btn-chat');
      const btnMail = document.getElementById('btn-mail');

      if (tab === 'chat') {
        chatTab.style.display = 'flex';
        mailTab.style.display = 'none';
        btnChat.classList.add('active');
        btnMail.classList.remove('active');
      } else {
        chatTab.style.display = 'none';
        mailTab.style.display = 'block';
        btnMail.classList.add('active');
        btnChat.classList.remove('active');
      }
    }
  </script>
</body>
</html>
