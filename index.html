<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ali AI - الشات السريع</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* تحسينات سريعة لشريط الإدخال والأزرار */
    .chat-input-container {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px;
      background: #111a2e;
      border-top: 1px solid #1f293d;
    }

    .chat-input-container input {
      flex: 1;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #2a3b5c;
      background: #0a0f1d;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .chat-input-container input:focus {
      border-color: #00ff88;
    }

    .icon-btn, #sendBtn {
      padding: 10px 14px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
    }

    .icon-btn {
      background: #1f293d;
      color: #fff;
    }

    .icon-btn:hover {
      background: #2a3b5c;
    }

    #sendBtn {
      background: #00ff88;
      color: #0a0f1d;
      font-weight: bold;
    }

    #sendBtn:hover {
      background: #00cc6a;
    }
  </style>
</head>
<body>

  <div class="chat-wrapper">
    <!-- الهيدر أو شريط العنوان -->
    <header class="chat-header">
      <div class="status-indicator">
        <span class="dot"></span>
        <span id="status">STATUS: READY</span>
      </div>
      <h2>GROQ AI</h2>
    </header>

    <!-- صندوق عرض المحادثات -->
    <div id="chat-box" class="chat-box">
      <div class="msg system-msg">
        <div class="msg-author">SYSTEM</div>
        <div class="msg-content">مرحباً بك في النظام. اكتب استفسارك للبدء...</div>
      </div>
    </div>

    <!-- نموذج الإدخال والأزرار الجديدة -->
    <div class="chat-input-container">
      <input type="text" id="userInput" placeholder="اكتب أمرك أو سؤالك هنا..." />
      
      <!-- زر الميكروفون (التحديث الصوتي) -->
      <button id="micBtn" class="icon-btn" type="button" title="تحدث عبر الميكروفون">🎤</button>
      
      <!-- زر التحكم بالنطق الصوتي للردود -->
      <button id="ttsBtn" class="icon-btn" type="button" title="تفعيل/إلغاء القراءة الصوتية">🔊</button>      
      
      <!-- زر الإرسال -->
      <button id="sendBtn" type="button">إرسال ➔</button>
    </div>
  </div>

  <!-- ربط ملف السكريبت الخاص بالشات -->
  <script src="js/chat.js"></script>
</body>
</html>
