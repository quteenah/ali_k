<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER_AI_V1.0 // ALL-IN-ONE PLATFORM</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="chat-wrapper">
    <!-- شريط العناوين الرئيسي -->
    <header class="chat-header">
      <div class="header-top">
        <span class="status-indicator">
          <span class="dot"></span>
          <span id="status">SYSTEM ONLINE</span>
        </span>
        <h2>GROQ AI</h2>
      </div>

      <!-- شريط التبويبات والأقسام -->
      <nav class="nav-tabs">
        <button class="tab-btn active" onclick="switchTab('chat-tab', this)">⚡ الشات السريع</button>
        <button class="tab-btn" onclick="switchTab('mail-tab', this)">📧 خدمة البريد (AliMail)</button>
        <!-- يمكنك إضافة أقسام جديدة هنا مستقبلاً -->
      </nav>
    </header>

    <!-- قسم الشات الذكي -->
    <div id="chat-tab" class="tab-content active-content">
      <div id="chat-box" class="chat-box">
        <div class="msg system-msg">
          <div class="msg-author">SYSTEM</div>
          <div class="msg-content">مرحباً بك في النظام. اكتب استفسارك للبدء...</div>
        </div>
      </div>

      <div class="chat-input-container">
        <button id="sendBtn" type="button">إرسال ➔</button>
        <input type="text" id="userInput" placeholder="اكتب أمرك أو سؤالك هنا..." />
      </div>
    </div>

    <!-- قسم خدمة البريد الإلكتروني (AliMail) -->
    <div id="mail-tab" class="tab-content">
      <iframe src="https://alimail.onrender.com/" class="app-iframe" title="AliMail Service"></iframe>
    </div>

  </div>

  <script src="js/chat.js"></script>
  <script>
    // الدالة المسؤولة عن التنقل بين الأقسام
    function switchTab(tabId, btn) {
      // إخفاء جميع الأقسام
      document.querySelectorAll('.tab-content').forEach(content => {
        content.classList.remove('active-content');
      });
      // إزالة التفعيل عن الأزرار
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('active');
      });

      // إظهار القسم المطلوب وتفعيل زره
      document.getElementById(tabId).classList.add('active-content');
      btn.classList.add('active');
    }
  </script>
</body>
</html>
